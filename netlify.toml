[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  [build.environment]
    NODE_VERSION = "20"

[[redirects]]
  from = "/LoginABEEHA"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/LoginABEEHA"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    # Report-Only first: tighten to Content-Security-Policy after checking the browser console on the live site.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
